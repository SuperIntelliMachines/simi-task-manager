name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - staging
          - production
      dry_run:
        description: "Run in dry-run mode without applying migrations"
        required: false
        default: true
        type: boolean

concurrency:
  group: db-migrations-${{ github.ref_name }}-${{ github.event.inputs.environment || 'auto' }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: super-intelli-machines
  GCP_REGION: asia-south1
  CLOUD_SQL_INSTANCE: sim-db-instance
  DATABASE_NAME: simi_task_manager
  DATABASE_USER: postgres

jobs:
  validate-migrations:
    name: Validate Migration Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: pip install sqlparse

      - name: Validate SQL syntax
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import sys
          import sqlparse

          migration_dir = "database/migrations"
          errors = []

          if not os.path.exists(migration_dir):
              print(f"Migration directory not found: {migration_dir}")
              sys.exit(1)

          sql_files = sorted(f for f in os.listdir(migration_dir) if f.endswith(".sql"))
          if not sql_files:
              print("No SQL migration files found. Skipping SQL parse.")
              sys.exit(0)

          for filename in sql_files:
              filepath = os.path.join(migration_dir, filename)
              print(f"Checking {filename}")
              with open(filepath, "r", encoding="utf-8") as handle:
                  sql = handle.read()
              statements = sqlparse.parse(sql)
              if not statements:
                  errors.append(f"No SQL statements found in {filename}")

          if errors:
              for error in errors:
                  print(f"ERROR: {error}")
              sys.exit(1)

          print("SQL migration files parsed successfully.")
          PYTHON_SCRIPT

      - name: Check migration naming convention
        shell: bash
        run: |
          shopt -s nullglob
          files=(database/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No SQL migration files found. Skipping naming check."
            exit 0
          fi

          for file in "${files[@]}"; do
            filename=$(basename "$file")
            if [[ ! "$filename" =~ ^V[0-9]{3}__[a-z0-9_]+\.sql$ ]]; then
              echo "Invalid migration name: $filename"
              echo "Expected format: V001__description.sql"
              exit 1
            fi
            echo "Valid migration name: $filename"
          done

  dry-run-migration:
    name: Dry Run Migration
    runs-on: ubuntu-latest
    needs: validate-migrations
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check secrets availability
        id: check-secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          if [ -z "$GCP_SA_KEY" ] || [ -z "$DATABASE_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.check-secrets.outputs.available == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        if: steps.check-secrets.outputs.available == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Start Cloud SQL Auth Proxy
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.4/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy ${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.CLOUD_SQL_INSTANCE }} --port 5432 &
          sleep 5

      - name: Show pending migrations
        if: steps.check-secrets.outputs.available == 'true'
        env:
          PGPASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          applied=$(psql -h 127.0.0.1 -p 5432 -U ${{ env.DATABASE_USER }} -d ${{ env.DATABASE_NAME }} -t -c \
            "SELECT migration_name FROM schema_migrations ORDER BY applied_at;" 2>/dev/null || echo "")

          echo "## Migration Dry Run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          for file in database/migrations/*.sql; do
            filename=$(basename "$file")
            if echo "$applied" | grep -q "$filename"; then
              echo "- SKIP: $filename already applied" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- PENDING: $filename" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Secrets unavailable notice
        if: steps.check-secrets.outputs.available != 'true'
        run: |
          echo "Database dry-run skipped because GCP or database secrets are unavailable."
          echo "SQL validation still passed."

  apply-migration:
    name: Apply Pending Migrations
    runs-on: ubuntu-latest
    needs: validate-migrations
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
    environment:
      name: ${{ github.event.inputs.environment || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.4/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy ${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.CLOUD_SQL_INSTANCE }} --port 5432 &
          sleep 5

      - name: Create migration tracking table
        env:
          PGPASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          psql -h 127.0.0.1 -p 5432 -U ${{ env.DATABASE_USER }} -d ${{ env.DATABASE_NAME }} <<EOF
          CREATE TABLE IF NOT EXISTS schema_migrations (
            id SERIAL PRIMARY KEY,
            migration_name VARCHAR(255) NOT NULL UNIQUE,
            applied_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            applied_by VARCHAR(100),
            checksum VARCHAR(64),
            execution_time_ms INTEGER
          );
          EOF

      - name: Apply pending migrations
        env:
          PGPASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          shopt -s nullglob
          for file in database/migrations/*.sql; do
            filename=$(basename "$file")
            applied=$(psql -h 127.0.0.1 -p 5432 -U ${{ env.DATABASE_USER }} -d ${{ env.DATABASE_NAME }} -t -c \
              "SELECT COUNT(*) FROM schema_migrations WHERE migration_name = '$filename';")

            if [ "$(echo "$applied" | xargs)" -gt 0 ]; then
              echo "SKIP: $filename already applied"
              continue
            fi

            echo "Applying $filename"
            checksum=$(sha256sum "$file" | cut -d' ' -f1)
            start_time=$(date +%s%3N)

            psql -h 127.0.0.1 -p 5432 -U ${{ env.DATABASE_USER }} -d ${{ env.DATABASE_NAME }} \
              --set ON_ERROR_STOP=1 -f "$file"

            end_time=$(date +%s%3N)
            execution_time=$((end_time - start_time))

            psql -h 127.0.0.1 -p 5432 -U ${{ env.DATABASE_USER }} -d ${{ env.DATABASE_NAME }} -c \
              "INSERT INTO schema_migrations (migration_name, applied_by, checksum, execution_time_ms)
               VALUES ('$filename', 'github-actions', '$checksum', $execution_time)
               ON CONFLICT (migration_name) DO NOTHING;"
          done

      - name: Migration report
        if: always()
        env:
          PGPASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          echo "## Migration Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migration | Applied At | Time |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|------------|------|" >> "$GITHUB_STEP_SUMMARY"
          psql -h 127.0.0.1 -p 5432 -U ${{ env.DATABASE_USER }} -d ${{ env.DATABASE_NAME }} -t -c \
            "SELECT '| ' || migration_name || ' | ' || TO_CHAR(applied_at, 'YYYY-MM-DD HH24:MI:SS') || ' | ' || execution_time_ms || 'ms |'
             FROM schema_migrations ORDER BY applied_at DESC LIMIT 10;" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  schema-diff:
    name: Schema Diff Report
    runs-on: ubuntu-latest
    needs: validate-migrations
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate schema diff summary
        run: |
          echo "## Schema Changes in This PR" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'database/migrations/*.sql' 'database/modules/*.sql')
          if [ -z "$changed_files" ]; then
            echo "No database schema changes detected." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### Changed Files" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$changed_files" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### CREATE TABLE Statements" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          for file in $changed_files; do
            if [ -f "$file" ]; then
              grep -h "CREATE TABLE" "$file" 2>/dev/null || true
            fi
          done >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
