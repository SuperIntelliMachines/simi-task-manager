services:
	postgres:
		image: postgres:16-alpine
		container_name: atm-postgres
		environment:
			POSTGRES_DB: task_manager
			POSTGRES_USER: postgres
			POSTGRES_PASSWORD: postgres
		ports:
			- "5432:5432"
		volumes:
			- postgres_data:/var/lib/postgresql/data
		healthcheck:
			test: ["CMD-SHELL", "pg_isready -U postgres -d task_manager"]
			interval: 10s
			timeout: 5s
			retries: 5

	redis:
		image: redis:7-alpine
		container_name: atm-redis
		ports:
			- "6379:6379"
		healthcheck:
			test: ["CMD", "redis-cli", "ping"]
			interval: 10s
			timeout: 5s
			retries: 5

	backend:
		build:
			context: ./backend
			dockerfile: Dockerfile
		container_name: atm-backend
		env_file:
			- .env
		environment:
			DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/task_manager}
			REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
			JWT_SECRET: ${JWT_SECRET:-change-me}
		ports:
			- "8000:8000"
		volumes:
			- ./backend:/app
		depends_on:
			postgres:
				condition: service_healthy
			redis:
				condition: service_healthy

	frontend:
		build:
			context: ./frontend
			dockerfile: Dockerfile
		container_name: atm-frontend
		environment:
			VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
		ports:
			- "5173:5173"
		volumes:
			- ./frontend:/app
			- /app/node_modules
		depends_on:
			- backend

	celery-worker:
		build:
			context: ./backend
			dockerfile: Dockerfile
		container_name: atm-celery-worker
		env_file:
			- .env
		environment:
			DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/task_manager}
			REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
			JWT_SECRET: ${JWT_SECRET:-change-me}
		command: ["celery", "-A", "app.jobs", "worker", "--loglevel=info"]
		volumes:
			- ./backend:/app
		depends_on:
			postgres:
				condition: service_healthy
			redis:
				condition: service_healthy
			backend:
				condition: service_started

	celery-beat:
		build:
			context: ./backend
			dockerfile: Dockerfile
		container_name: atm-celery-beat
		env_file:
			- .env
		environment:
			DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/task_manager}
			REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
			JWT_SECRET: ${JWT_SECRET:-change-me}
		command: ["celery", "-A", "app.jobs", "beat", "--loglevel=info"]
		volumes:
			- ./backend:/app
		depends_on:
			redis:
				condition: service_healthy
			celery-worker:
				condition: service_started

volumes:
	postgres_data:
